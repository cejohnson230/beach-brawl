<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OxFit Takes Beach Brawl</title>
<meta name="description" content="OxFit Takes Beach Brawl — live heat and lane board for the crew at Beach Brawl '26, Pensacola Beach FL.">
<meta name="theme-color" content="#25ABF3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23081359'/%3E%3Ccircle cx='50' cy='38' r='19' fill='%23FFC53D'/%3E%3Cpath d='M0 62q25-12 50 0t50 0v38H0z' fill='%2325ABF3'/%3E%3C/svg%3E">
<style>
  :root{
    --sand:#FBF4E6;
    --surface:#FFFDF7;
    --ink:#081359;
    --ink-70:rgba(8,19,89,.70);
    --ink-45:rgba(8,19,89,.45);
    --ink-15:rgba(8,19,89,.15);
    --azure:#25ABF3;
    --azure-bright:#33A7FF;
    --azure-deep:#1488D4;
    --sun:#FFC53D;
    --coral:#FF6B4A;
    --sea:#00B894;
    --azure-ink:#0B6FB0;
    --coral-ink:#C43A1A;
    --sea-ink:#00705A;
    --sun-ink:#8A5A00;
    --surf:#9B5DE5;
    --surf-ink:#5E2E96;
    --display:'Oswald',Impact,sans-serif;
    --body:'Lato',system-ui,sans-serif;
    --bd:3px solid var(--ink);
    --pop:5px 5px 0 var(--ink);
    --pop-sm:3px 3px 0 var(--ink);
    --gut:16px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:var(--body);
    font-weight:400;
    line-height:1.45;
    min-height:100dvh;
    overflow-x:hidden;
    /* faint sun-bleached horizon */
    background-image:
      radial-gradient(120% 55% at 50% -10%, rgba(37,171,243,.16) 0%, transparent 62%);
    background-repeat:no-repeat;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  /* One colour per arena, fixed to the event order in the sheet. --ac is the
     saturated block colour (bars, chips); --acd is the darkened variant used
     for text, which needs to stay readable on cream. Colour is always
     reinforcement — the arena is spelled out everywhere too. */
  .a0{--ac:var(--azure);--acd:var(--azure-ink)}  /* Event 1 · Backout Barbell */
  .a1{--ac:var(--coral);--acd:var(--coral-ink)}  /* Event 2 · Mayhem Athlete  */
  .a2{--ac:var(--sea);  --acd:var(--sea-ink)}    /* Event 3 · LRX Beach       */
  .a3{--ac:var(--sun);  --acd:var(--sun-ink)}    /* Event 4 · PR Apparel      */
  .a4{--ac:var(--surf); --acd:var(--surf-ink)}   /* Friday · Elite Beach      */

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--ink);
    border-bottom:var(--bd);
    padding-top:env(safe-area-inset-top);
  }
  .hwrap{max-width:560px;margin:0 auto}
  .stripes{
    height:10px;
    background:repeating-linear-gradient(115deg,
      var(--azure) 0 14px, var(--azure-deep) 14px 28px,
      var(--sun) 28px 42px, var(--ink) 42px 56px);
  }
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px var(--gut) 9px;
  }
  .brand{font-family:var(--display);font-weight:700;letter-spacing:.05em;
    font-size:clamp(17px,4.9vw,23px);line-height:1.04;color:var(--sand);
    text-transform:uppercase}
  .brand em{font-style:normal;color:var(--azure-bright)}
  .venue{font-size:10px;letter-spacing:.17em;text-transform:uppercase;
    color:rgba(251,244,230,.62);font-weight:700;margin-top:4px}
  .clock{text-align:right;flex:none}
  .clock b{display:block;font-family:var(--display);font-weight:600;
    font-size:clamp(21px,5.6vw,27px);line-height:1;color:var(--sand)}
  .clock span{display:block;font-size:9.5px;letter-spacing:.17em;font-weight:700;
    color:var(--azure-bright);text-transform:uppercase;margin-top:4px}

  /* ---------- day tabs ---------- */
  .tabs{display:flex;background:var(--ink);gap:0;
    padding:0 var(--gut) 12px}
  .tab{
    flex:1;appearance:none;cursor:pointer;
    background:transparent;color:rgba(251,244,230,.6);
    border:2px solid rgba(251,244,230,.28);
    font-family:var(--display);font-weight:600;text-transform:uppercase;
    letter-spacing:.05em;font-size:12px;padding:9px 3px 8px;line-height:1.2;
    transition:background .14s,color .14s,border-color .14s;
  }
  .tab + .tab{border-left-width:1px}
  .tab:not(:last-child){border-right-width:1px}
  .tab small{display:block;font-size:8.5px;letter-spacing:.09em;opacity:.8;
    font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .tab[aria-selected="true"]{
    background:var(--azure);color:#fff;border-color:var(--azure);
  }
  .tab:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  /* ---------- layout ---------- */
  main{max-width:560px;margin:0 auto;padding:0 var(--gut) 56px}

  /* ---------- hero status ---------- */
  .hero{
    background:var(--surface);border:var(--bd);box-shadow:var(--pop);
    margin:18px 0 26px;padding:17px 16px 16px;position:relative;overflow:hidden;
  }
  .hero.is-live{background:var(--azure);color:#fff;border-color:var(--ink)}
  .hero.is-live .hero-k{color:rgba(255,255,255,.92)}
  .hero.is-live .hero-sub{color:rgba(255,255,255,.88)}
  .hero-k{
    font-family:var(--display);font-weight:600;text-transform:uppercase;
    letter-spacing:.16em;font-size:11.5px;color:var(--ink-70);
    display:flex;align-items:center;gap:7px;
  }
  .hero-v{
    font-family:var(--display);font-weight:700;line-height:.95;
    font-size:clamp(40px,13.5vw,62px);letter-spacing:.005em;margin-top:8px;
  }
  .hero-v small{
    font-size:.25em;letter-spacing:.08em;margin-left:.32em;opacity:.68;
    font-weight:600;text-transform:uppercase;
  }
  .hero-v.words{font-size:clamp(30px,9vw,46px)}
  .hero-sub{font-size:13px;color:var(--ink-70);margin-top:9px;font-weight:700;
    letter-spacing:.02em}
  .dot{
    width:11px;height:11px;border-radius:50%;background:var(--coral);
    box-shadow:0 0 0 0 rgba(255,107,74,.8);animation:ping 1.9s infinite;flex:none;
  }
  .hero.is-live .dot{background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.85)}
  @keyframes ping{
    70%{box-shadow:0 0 0 11px rgba(255,107,74,0)}
    100%{box-shadow:0 0 0 0 rgba(255,107,74,0)}
  }

  /* ---------- view mode toggle ---------- */
  .modes{display:flex;margin:0 0 22px;border:3px solid var(--ink);
    box-shadow:var(--pop-sm);background:var(--surface)}
  .mode{
    flex:1;appearance:none;cursor:pointer;background:transparent;color:var(--ink-45);
    border:0;border-right:3px solid var(--ink);
    font-family:var(--display);font-weight:600;text-transform:uppercase;
    letter-spacing:.11em;font-size:12px;padding:10px 4px 9px;line-height:1;
    transition:background .14s,color .14s;
  }
  .mode:last-child{border-right:0}
  .mode[aria-pressed="true"]{background:var(--ink);color:var(--sand)}
  .mode:focus-visible{outline:3px solid var(--azure);outline-offset:-4px}

  /* ---------- division picker ---------- */
  /* display:flex would otherwise beat the [hidden] attribute, leaving the
     picker on screen in every view. */
  .picker[hidden]{display:none}
  .picker{
    display:flex;align-items:center;gap:10px;margin:0 0 20px;
    border:3px solid var(--ink);background:var(--surface);
    box-shadow:var(--pop-sm);padding:9px 11px;
  }
  .picker label{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.14em;font-size:10.5px;color:var(--ink-45);flex:none;
  }
  .picker select{
    flex:1;min-width:0;appearance:none;cursor:pointer;
    background:transparent;border:0;color:var(--ink);
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;font-size:16px;padding:2px 18px 2px 0;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),
                     linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 9px) 55%, calc(100% - 4px) 55%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  .picker select:focus-visible{outline:3px solid var(--azure);outline-offset:3px}

  /* ---------- workouts ---------- */
  .wod{margin:0 0 24px}
  .wod-h{
    display:flex;align-items:center;gap:9px;margin-bottom:8px;
    border-bottom:3px solid var(--ac,var(--ink));padding-bottom:7px;
  }
  .wod-h i{
    font-style:normal;flex:none;font-family:var(--display);font-weight:700;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;
    background:var(--acd,var(--ink));padding:4px 7px 3px;
  }
  .wod-h b{
    flex:1;min-width:0;font-family:var(--display);font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;
    font-size:clamp(15px,4.3vw,18px);line-height:1.1;color:var(--acd,var(--ink));
  }
  .wod-h .when{
    flex:none;font-family:var(--display);font-weight:700;font-size:13px;
    letter-spacing:.03em;color:var(--ink-45);
  }
  .tagline{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.11em;font-size:11px;color:var(--ink-45);margin-bottom:9px;
  }
  .tagline em{font-style:normal;color:var(--acd,var(--ink))}
  .wod-body{
    background:var(--surface);border:3px solid var(--ink);
    box-shadow:var(--pop);padding:13px 15px;
  }
  .wod-body.is-live{background:var(--azure);border-color:var(--ink);color:#fff}
  .wod-div{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.11em;font-size:10.5px;color:var(--ink-45);
    margin-bottom:7px;padding-bottom:6px;border-bottom:2px solid var(--ink-15);
  }
  .wod-body.is-live .wod-div{color:rgba(255,255,255,.85);
    border-bottom-color:rgba(255,255,255,.3)}
  .wod-line{
    font-family:var(--display);font-weight:600;font-size:16px;line-height:1.34;
    letter-spacing:.015em;
  }
  .wod-line.part{
    font-weight:700;text-transform:uppercase;font-size:11.5px;
    letter-spacing:.13em;color:var(--ink-45);margin-top:9px;
  }
  .wod-body.is-live .wod-line.part{color:rgba(255,255,255,.82)}
  .wod-line.prose{
    font-family:var(--body);font-weight:400;font-size:13.5px;line-height:1.5;
    margin-top:7px;color:var(--ink-70);
  }
  .wod-body.is-live .wod-line.prose{color:rgba(255,255,255,.9)}
  .wod-note{
    font-family:var(--body);font-size:12px;color:var(--ink-70);margin-top:9px;
    padding-left:13px;position:relative;line-height:1.45;
  }
  .wod-note::before{content:"*";position:absolute;left:0;color:var(--ink-45)}
  .wod-link{
    display:inline-block;margin-top:10px;
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.12em;font-size:10.5px;color:var(--azure-deep);
    border-bottom:2px solid var(--azure);text-decoration:none;padding-bottom:1px;
  }
  .wod-link:hover{color:var(--ink);border-bottom-color:var(--ink)}

  /* ---------- arena view ---------- */
  .arena-h{
    display:flex;align-items:center;gap:9px;margin:0 0 10px;
    border-bottom:3px solid var(--ink);padding-bottom:7px;
  }
  .arena-h{border-bottom-color:var(--ac,var(--ink))}
  .arena-h i{
    font-style:normal;flex:none;font-family:var(--display);font-weight:700;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;
    background:var(--acd,var(--ink));padding:4px 7px 3px;
  }
  .arena-h b{font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;font-size:clamp(16px,4.6vw,19px);line-height:1.1;
    color:var(--acd,var(--ink))}
  .arow{
    position:relative;display:flex;align-items:center;gap:10px;
    background:var(--surface);border:2px solid var(--ink);
    box-shadow:var(--pop-sm);padding:8px 11px 8px 20px;margin-bottom:7px;
  }
  /* The arena bar is a pseudo-element rather than a border-left, because the
     state rules below set border-width, which would silently collapse a
     border-left and take the arena cue with it. */
  .row::before,.arow::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
    background:var(--ac,var(--ink));
  }
  /* On a highlighted row the bar would otherwise sit on its own hue — azure
     on the azure "now" row, sun on the sun "next" row — so switch to the
     darkened variant, which stays visible against both. */
  .row.next::before,.arow.is-live::before,.arow.is-next::before{
    background:var(--acd,var(--ink));
  }
  .arow .t{font-family:var(--display);font-weight:700;font-size:14px;
    flex:none;width:68px;letter-spacing:.02em}
  .arow .who{flex:1;min-width:0;font-family:var(--display);font-weight:600;
    text-transform:uppercase;font-size:15px;letter-spacing:.025em;line-height:1.15;
    overflow-wrap:break-word}
  .arow .hl{flex:none;text-align:right;font-family:var(--display);font-weight:700;
    font-size:14px;letter-spacing:.04em;line-height:1.15}
  .arow .hl small{display:block;font-size:9px;font-weight:500;letter-spacing:.13em;
    color:var(--ink-45);text-transform:uppercase}
  .arow .tag{
    flex:none;font-family:var(--display);font-weight:700;font-size:9px;
    letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:#fff;
    padding:3px 6px 2px;
  }
  .arow.is-done{opacity:.62;box-shadow:none;border-color:var(--ink-15)}
  .arow.is-next{background:var(--sun);border-width:3px;box-shadow:var(--pop)}
  .arow.is-live{background:var(--azure);border-width:3px;box-shadow:var(--pop);color:#fff}
  .arow.is-live .hl small{color:rgba(255,255,255,.82)}
  .arow.is-live .tag{background:#fff;color:var(--ink)}

  /* ---------- section headings ---------- */
  .sec{margin:0 0 26px}
  .sec-h{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .sec-h h2{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.13em;font-size:13px;white-space:nowrap;
  }
  .sec-h .rule{flex:1;height:3px;background:var(--ink);opacity:.16}
  .sec-h .cnt{
    font-family:var(--display);font-size:11px;font-weight:600;
    letter-spacing:.09em;color:var(--ink-45);
  }

  /* ---------- now cards ---------- */
  .now-card{
    background:var(--surface);border:var(--bd);box-shadow:var(--pop);
    padding:15px 15px 14px 18px;margin-bottom:13px;position:relative;
  }
  .now-card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
    background:var(--ac,var(--azure));
  }
  .now-name{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:clamp(25px,7.2vw,35px);line-height:1.02;letter-spacing:.012em;
    word-break:break-word;
  }
  .now-arena{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.07em;font-size:clamp(14px,4vw,17px);
    color:var(--acd,var(--azure-deep));margin-top:6px;
  }
  .now-arena em{font-style:normal;font-weight:500;font-size:.72em;
    letter-spacing:.11em;color:var(--ink-45);margin-left:.45em}
  .now-wod{
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;font-size:11px;color:var(--ink-45);margin-top:7px;
  }
  .slots{display:flex;gap:9px;margin-top:13px}
  .slot{
    flex:1;border:2px solid var(--ink);background:var(--sand);
    padding:6px 9px 7px;
  }
  .slot i{
    display:block;font-style:normal;font-family:var(--display);font-weight:600;
    font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;
    color:var(--ink-45);
  }
  .slot b{
    display:block;font-family:var(--display);font-weight:700;
    font-size:clamp(24px,6.6vw,30px);line-height:1.05;margin-top:1px;
  }
  .slot.time b{font-size:clamp(17px,4.6vw,21px);padding-top:4px}

  /* ---------- schedule rows ---------- */
  .grp{margin-bottom:13px}
  .grp-t{
    display:flex;align-items:baseline;gap:9px;margin-bottom:5px;
  }
  .grp-t b{
    font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.03em;
  }
  .grp-t span{
    font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--ink-45);
  }
  .row{
    position:relative;display:flex;align-items:center;gap:11px;
    background:var(--surface);border:2px solid var(--ink);
    box-shadow:var(--pop-sm);padding:9px 11px 9px 20px;margin-bottom:7px;
  }
  .row .who{flex:1;min-width:0}
  .row .who b{
    display:block;font-family:var(--display);font-weight:600;
    text-transform:uppercase;font-size:16px;letter-spacing:.025em;line-height:1.15;
    overflow-wrap:break-word;
  }
  .row .who span{
    display:block;margin-top:3px;
    font-family:var(--display);font-weight:700;text-transform:uppercase;
    font-size:13px;letter-spacing:.075em;color:var(--acd,var(--ink-70));
  }
  .row .who span em{font-style:normal;font-weight:500;font-size:.82em;
    letter-spacing:.1em;color:var(--ink-45);margin-left:.4em}
  /* On the yellow "next" row the darkened arena colour loses contrast,
     so fall back to ink there; the left bar still carries the colour. */
  .row.next .who span{color:var(--ink)}
  .row.next .who span em{color:rgba(8,19,89,.6)}
  .row .hl{
    flex:none;text-align:right;font-family:var(--display);font-weight:700;
    font-size:15px;letter-spacing:.04em;line-height:1.15;
  }
  .row .hl small{
    display:block;font-size:9.5px;font-weight:500;letter-spacing:.13em;
    color:var(--ink-45);text-transform:uppercase;
  }
  .row.next{border-width:3px;box-shadow:var(--pop);background:var(--sun)}

  /* ---------- done / disclosure ---------- */
  details.done{border-top:3px solid var(--ink-15);padding-top:14px;margin-top:4px}
  details.done>summary{
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
    font-family:var(--display);font-weight:600;text-transform:uppercase;
    letter-spacing:.13em;font-size:12px;color:var(--ink-45);padding:3px 0;
  }
  details.done>summary::-webkit-details-marker{display:none}
  details.done>summary::before{content:"▸";font-size:11px;transition:transform .15s}
  details.done[open]>summary::before{transform:rotate(90deg)}
  details.done>summary:focus-visible{outline:3px solid var(--azure);outline-offset:3px}
  .done-list{margin-top:11px;opacity:.62}
  .done-list .row{box-shadow:none;border-width:2px;border-color:var(--ink-15)}

  /* ---------- tbd + footer ---------- */
  .tbd{
    border:3px dashed var(--ink-15);padding:12px 14px;margin-top:4px;
  }
  .tbd h3{
    font-family:var(--display);font-weight:600;text-transform:uppercase;
    letter-spacing:.13em;font-size:11.5px;color:var(--ink-45);
  }
  .tbd p{font-family:var(--display);font-weight:600;font-size:17px;margin-top:5px;
    text-transform:uppercase;letter-spacing:.03em}

  .empty{
    background:var(--surface);border:3px dashed var(--ink-15);
    padding:22px 16px;text-align:center;
  }
  .empty b{display:block;font-family:var(--display);font-weight:600;
    text-transform:uppercase;letter-spacing:.1em;font-size:14px}
  .empty span{display:block;font-size:12.5px;color:var(--ink-70);margin-top:6px}

  .ftlink{
    display:inline-block;margin-top:9px;color:var(--azure-deep);
    text-decoration:none;border-bottom:2px solid var(--azure);
    padding-bottom:1px;letter-spacing:.1em;
  }
  footer{
    max-width:560px;margin:0 auto;padding:22px var(--gut) 40px;
    border-top:3px solid var(--ink-15);
    font-size:11px;letter-spacing:.06em;color:var(--ink-45);text-transform:uppercase;
    font-weight:700;text-align:center;line-height:1.7;
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
    white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (min-width:600px){
    :root{--gut:22px}
    .slots{max-width:400px}
  }
</style>
</head>

<header>

     ================================================================== */

  var partsFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: TZ, hour12: false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });

  function venueParts(ms){
    var o = {};
    partsFmt.formatToParts(new Date(ms)).forEach(function(p){
      if (p.type !== 'literal') o[p.type] = +p.value;
    });
    // Intl can emit hour 24 for midnight under hour12:false
    if (o.hour === 24) o.hour = 0;
    return o;
  }

  // Offset (ms) by which venue wall-clock leads UTC at a given instant.
  function venueOffset(ms){
    var p = venueParts(ms);
    return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - ms;
  }

  // Venue wall-clock ("2026-09-26", secondsFromMidnight) -> epoch ms.
  // Two passes so the offset is sampled at the resolved instant, which
  // keeps it correct across a DST boundary.
  function wallToEpoch(dateISO, sec){
    var d = dateISO.split('-');
    var naive = Date.UTC(+d[0], +d[1] - 1, +d[2]) + sec * 1000;
    var t = naive - venueOffset(naive);
    return naive - venueOffset(t);
  }

  function venueDateISO(ms){
    var p = venueParts(ms);
    return p.year + '-' + String(p.month).padStart(2,'0') + '-' +
           String(p.day).padStart(2,'0');
  }

  /* ---- clock source, overridable via ?now= for testing ---- */
  var frozen = null;
  var qs = new URLSearchParams(location.search);
  if (qs.has('now')) {
    var m = /^(\d{4}-\d{2}-\d{2})[T ](\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(qs.get('now').trim());
    if (m) frozen = wallToEpoch(m[1], (+m[2])*3600 + (+m[3])*60 + (+(m[4]||0)));
  }
  function now(){ return frozen !== null ? frozen : Date.now(); }

  /* ---- formatting ---- */
  function fmtClock(ms){
    var p = venueParts(ms), h = p.hour % 12; if (h === 0) h = 12;
    return h + ':' + String(p.minute).padStart(2,'0') +
           ' ' + (p.hour < 12 ? 'AM' : 'PM');
  }
  function fmtDur(sec){
    sec = Math.max(0, Math.floor(sec));
    var d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600),
        m = Math.floor(sec%3600/60), s = sec%60, p2 = function(n){return String(n).padStart(2,'0')};
    if (d > 0) return d + 'd ' + h + 'h ' + p2(m) + 'm';
    if (h > 0) return h + ':' + p2(m) + ':' + p2(s);
    return m + ':' + p2(s);
  }
  // The hero countdown sits right under a live wall clock, so "20:00" on its
  // own is ambiguous. Attach an explicit unit unless the value already
  // carries one (the multi-day form does).
  function durHTML(sec){
    sec = Math.max(0, Math.floor(sec));
    var unit = sec < 3600 ? 'Min' : (sec < 86400 ? 'Hrs' : '');
    return fmtDur(sec) + (unit ? '<small>' + unit + '</small>' : '');
  }
  function fmtMins(sec){
    var m = Math.round(sec/60);
    if (m < 60) return m + ' min';
    var h = Math.floor(m/60);
    return h + 'h ' + String(m%60).padStart(2,'0') + 'm';
  }
  function shortArena(a){ return a.replace(/\s+Arena$/i,''); }
  // Arena colour is keyed off its position in the sheet's event order.
  function arenaCls(a){
    var i = DATA.arenas.indexOf(a);
    return i < 0 ? '' : 'a' + i;
  }

  /* ---- workouts -----------------------------------------------------
     Attached by event number, never by arena name: the heat sheet says
     "Backout Barbell"/"LRX Beach" where the organisers say "Blackout
     Barbell"/"LRX". The build cross-checks that the two agree.        */
  function wodFor(day, eventNo){
    var set = WODS[day.wodKey];
    return (set && set[String(eventNo)]) || null;
  }
  // Division names are written inconsistently across events — "Teen (16-17)"
  // in one, "Teen 16-17" in another, and several rolled into a single
  // "Intermediate/ Masters 40+/ Teens/ Scaled" block. Normalise to compare.
  function normDiv(x){ return x.toLowerCase().replace(/[^a-z0-9+]/g, ''); }
  function alphaDiv(x){ return x.toLowerCase().replace(/[^a-z]/g, ''); }
  function divTokens(name){ return name.split('/').map(function(x){ return x.trim(); })
    .filter(Boolean); }

  // The event with the most blocks spells out the day's real division list;
  // the others fold several divisions into one block.
  function divisionChoices(day){
    var best = [], set = WODS[day.wodKey] || {};
    Object.keys(set).forEach(function(k){
      var toks = [];
      (set[k].divisions || []).forEach(function(d){
        divTokens(d.name).forEach(function(t){ toks.push(t); });
      });
      if (toks.length > best.length) best = toks;
    });
    var seen = {}, out = [];
    best.forEach(function(t){
      if (/^all divisions$/i.test(t)) return;
      var k = normDiv(t);
      if (!seen[k]) { seen[k] = 1; out.push(t); }
    });
    return out;
  }

  // Exact token match first, then an alphabetic-prefix match so a choice of
  // "Teen 16-17" still lands in a block labelled "... / Teens / Scaled".
  function pickDivision(wod, choice){
    var divs = wod.divisions || [];
    if (!divs.length) return null;
    if (!choice) return divs[0];
    var want = normDiv(choice), wantA = alphaDiv(choice), i, j, toks;
    for (i = 0; i < divs.length; i++) {
      toks = divTokens(divs[i].name);
      for (j = 0; j < toks.length; j++) if (normDiv(toks[j]) === want) return divs[i];
    }
    for (i = 0; i < divs.length; i++) {
      toks = divTokens(divs[i].name);
      for (j = 0; j < toks.length; j++) {
        var a = alphaDiv(toks[j]);
        if (a && wantA && (a.indexOf(wantA) === 0 || wantA.indexOf(a) === 0)) return divs[i];
      }
    }
    return divs[0];
  }

  // Saturday and Sunday run four arenas; Friday runs one event on the beach.
  // Both views walk the day's own events rather than the global arena list.
  function dayEvents(day){
    var seen = {}, out = [];
    day.entries.forEach(function(e){
      if (!seen[e.eventNo]) { seen[e.eventNo] = 1; out.push({ no: e.eventNo, arena: e.arena }); }
    });
    return out.sort(function(a, b){ return a.no - b.no; });
  }

  function wodTag(day, eventNo){
    var w = wodFor(day, eventNo);
    if (!w) return '';
    var bits = [];
    if (w.format) bits.push(w.format);
    if (w.cap) bits.push(w.cap + ' cap');
    return bits.join(' · ');
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  /* ==================================================================
     State
     ================================================================== */

  var DAYS = {};
  DATA.days.forEach(function(d){ DAYS[d.id] = d; });

  function dayBounds(day){
    var starts = day.entries.map(function(e){ return wallToEpoch(day.date, e.startSec); });
    return {
      first: Math.min.apply(null, starts),
      last:  Math.max.apply(null, starts) + day.heatMinutes * 60000
    };
  }

  // Each day until its last heat has finished, then the next — so Friday
  // evening already shows Saturday, and Saturday evening shows Sunday.
  function autoDay(t){
    for (var i = 0; i < DATA.days.length - 1; i++) {
      if (t < dayBounds(DATA.days[i]).last) return DATA.days[i].id;
    }
    return DATA.days[DATA.days.length - 1].id;
  }

  var selected = null; // null = follow the calendar
  // 'time' = chronological running order, 'arena' = grouped by event/arena,
  // 'wods' = the workouts themselves. Both assigned below, outside the pure
  // block the tests extract.
  var viewMode = 'time';
  var division = null;

  function classify(day, t){
    var dur = day.heatMinutes * 60000;
    var live = [], upcoming = [], done = [];
    day.entries.forEach(function(e){
      var s = wallToEpoch(day.date, e.startSec), end = s + dur;
      var row = { e:e, start:s, end:end };
      if (t >= end) done.push(row);
      else if (t >= s) live.push(row);
      else upcoming.push(row);
    });
    var byStart = function(a,b){ return a.start - b.start || a.e.name.localeCompare(b.e.name); };
    live.sort(byStart); upcoming.sort(byStart); done.sort(byStart);
    var nextStart = upcoming.length ? upcoming[0].start : null;
    return {
      live: live, upcoming: upcoming, done: done, nextStart: nextStart,
      next: upcoming.filter(function(r){ return r.start === nextStart; }),
      later: upcoming.filter(function(r){ return r.start !== nextStart; }),
      liveEnd: live.length ? Math.min.apply(null, live.map(function(r){return r.end})) : null
    };
  }

  /* ==================================================================
     Render
     ================================================================== */

  function groupByStart(rows){
    var out = [], cur = null;
    rows.forEach(function(r){
      if (!cur || cur.start !== r.start) { cur = { start:r.start, rows:[] }; out.push(cur); }
      cur.rows.push(r);
    });
    return out;
  }

  function rowHTML(r, cls){
    return '<div class="row ' + arenaCls(r.e.arena) + ' ' + (cls||'') + '">' +
      '<div class="who"><b>' + esc(r.e.name) + '</b>' +
      '<span>' + esc(shortArena(r.e.arena)) +
        '<em>Event ' + r.e.eventNo + '</em></span></div>' +
      '<div class="hl num">' + r.e.heat + ' / ' + r.e.lane +
      '<small>Heat / Lane</small></div></div>';
  }

  function groupHTML(g, cls){
    return '<div class="grp"><div class="grp-t"><b class="num">' + fmtClock(g.start) +
      '</b><span>' + g.rows.length + ' up</span></div>' +
      g.rows.map(function(r){ return rowHTML(r, cls); }).join('') + '</div>';
  }

  function secHTML(title, count, inner){
    return '<section class="sec"><div class="sec-h"><h2>' + title + '</h2>' +
      '<div class="rule"></div>' +
      (count != null ? '<div class="cnt num">' + count + '</div>' : '') +
      '</div>' + inner + '</section>';
  }

  function tbdHTML(day){
    if (!day.tbd || !day.tbd.length) return '';
    return '<div class="tbd"><h3>Not yet scheduled</h3><p>' +
      day.tbd.map(esc).join(' · ') + '</p></div>';
  }

  // Event number and arena are locked together in the source sheet:
  // Event 1 is always Backout Barbell, Event 2 Mayhem, and so on. So one
  // grouping answers both "which event" and "which arena".
  function arenaSections(day, c){
    function key(e){ return e.name + '|' + e.eventNo; }
    /* eslint-disable-next-line no-unused-vars */
    var status = {};
    c.done.forEach(function(r){ status[key(r.e)] = 'is-done'; });
    c.live.forEach(function(r){ status[key(r.e)] = 'is-live'; });
    c.next.forEach(function(r){ status[key(r.e)] = 'is-next'; });

    return dayEvents(day).map(function(ev){
      var arena = ev.arena;
      var rows = day.entries.filter(function(e){ return e.arena === arena; })
        .sort(function(a, b){
          return a.startSec - b.startSec || a.name.localeCompare(b.name);
        });
      if (!rows.length) return '';
      return '<section class="sec ' + arenaCls(arena) + '">' +
        '<div class="arena-h"><i>Event ' + ev.no + '</i><b>' +
          esc(arena) + '</b></div>' +
        (wodTag(day, ev.no)
          ? '<div class="tagline">' + esc(wodTag(day, ev.no)) + '</div>' : '') +
        rows.map(function(e){
          var st = status[key(e)] || '';
          var tag = st === 'is-live' ? '<span class="tag">Now</span>'
                  : st === 'is-next' ? '<span class="tag">Next</span>' : '';
          return '<div class="arow ' + st + '">' +
            '<b class="t num">' + esc(e.time) + '</b>' +
            '<div class="who">' + esc(e.name) + '</div>' + tag +
            '<div class="hl num">' + e.heat + ' / ' + e.lane +
            '<small>Heat / Lane</small></div></div>';
        }).join('') +
      '</section>';
    }).join('');
  }

  // #body is rebuilt from a string, so a naive write every tick would snap
  // every <details> shut and destroy text selection. Skip writes that change
  // nothing, and carry disclosure state across the writes that do happen.
  var lastHTML = null, disclosure = {};
  function paint(html){
    if (html === lastHTML) return;
    var body = document.getElementById('body');
    Array.prototype.forEach.call(body.querySelectorAll('details[id]'), function(d){
      disclosure[d.id] = d.open;
    });
    body.innerHTML = html;
    lastHTML = html;
    Array.prototype.forEach.call(body.querySelectorAll('details[id]'), function(d){
      if (Object.prototype.hasOwnProperty.call(disclosure, d.id)) d.open = disclosure[d.id];
    });
  }

  // Announce only when the substance changes; the hero itself must not be a
  // live region or a screen reader would read the countdown once a second.
  var lastSaid = null;
  function announce(msg){
    if (msg === lastSaid) return;
    lastSaid = msg;
    document.getElementById('srStatus').textContent = msg;
  }

  // Partner/segment headings inside a workout are labels, not reps.
  function wodLineCls(line){
    if (/^partner\b|^then partner|^\d+:\d{2}\s+to\s+\d+:\d{2}|^\d+:\d{2} transition/i.test(line))
      return 'part';
    if (line.length > 64) return 'prose';
    return '';
  }

  function workoutSections(day, c, t){
    var liveEvents = {};
    c.live.forEach(function(r){ liveEvents[r.e.eventNo] = 1; });
    var nextEvents = {};
    c.next.forEach(function(r){ nextEvents[r.e.eventNo] = 1; });

    return dayEvents(day).map(function(ev){
      var arena = ev.arena, no = ev.no, w = wodFor(day, no);
      if (!w) return '';
      var div = pickDivision(w, division);
      var mine = day.entries.filter(function(e){ return e.eventNo === no; })
        .sort(function(a, b){ return a.startSec - b.startSec; });
      var when = mine.length
        ? mine[0].time + (mine.length > 1 ? '–' + mine[mine.length - 1].time : '')
        : '';
      var state = liveEvents[no] ? ' is-live' : '';
      var badge = liveEvents[no] ? '<span class="tag">Now</span>'
                : nextEvents[no] ? '<span class="tag">Next</span>' : '';

      return '<section class="wod ' + arenaCls(arena) + '">' +
        '<div class="wod-h"><i>Event ' + no + '</i><b>' + esc(arena) + '</b>' +
          badge + (when ? '<span class="when num">' + esc(when) + '</span>' : '') +
        '</div>' +
        '<div class="tagline">' + (w.format ? '<em>' + esc(w.format) + '</em>' : '') +
          (w.cap ? (w.format ? ' · ' : '') + esc(w.cap) + ' cap' : '') + '</div>' +
        '<div class="wod-body' + state + '">' +
          (div ? '<div class="wod-div">' + esc(div.name) + '</div>' : '') +
          (div ? div.lines.map(function(l){
            return '<div class="wod-line ' + wodLineCls(l) + '">' + esc(l) + '</div>';
          }).join('') : '') +
          (w.notes || []).map(function(n){
            return '<div class="wod-note">' + esc(n) + '</div>';
          }).join('') +
        '</div>' +
        '<a class="wod-link" href="' + esc(w.url) + '" target="_blank" ' +
          'rel="noopener">Flow &amp; movement standards &rarr;</a>' +
      '</section>';
    }).join('');
  }

  // The division list differs by day (individuals have Elite/Masters/Teen
  // tiers that teams do not), so the picker is rebuilt when the day changes.
  var pickerDay = null;
  function syncPicker(day){
    var choices = divisionChoices(day);
    // Friday's one event has a single block, so there is nothing to pick.
    document.getElementById('picker').hidden =
      viewMode !== 'wods' || !choices.length;
    if (pickerDay === day.id) return;
    pickerDay = day.id;
    var sel = document.getElementById('division');
    sel.innerHTML = choices.map(function(c){
      return '<option>' + esc(c) + '</option>';
    }).join('');
    var keep = division && choices.filter(function(c){
      return normDiv(c) === normDiv(division);
    })[0];
    division = keep ||
      choices.filter(function(c){ return /^rx$/i.test(c); })[0] ||
      choices[0] || null;
    if (division) sel.value = division;
  }

  function render(){
    var t = now();
    var dayId = selected || autoDay(t);
    var day = DAYS[dayId];
    var b = dayBounds(day);
    var isToday = venueDateISO(t) === day.date;
    var c = classify(day, t);

    document.getElementById('clock').textContent = fmtClock(t);

    DATA.days.forEach(function(d){
      document.getElementById('tab-' + d.id)
        .setAttribute('aria-selected', String(d.id === dayId));
    });

    var hero = document.getElementById('hero'),
        heroK = document.getElementById('heroK'),
        heroV = document.getElementById('heroV'),
        heroSub = document.getElementById('heroSub'),
        out = [];

    hero.classList.remove('is-live');
    var chrono = viewMode === 'time';

    if (t < b.first) {
      /* ---- before this day's first heat ---- */
      var away = (b.first - t) / 1000;
      heroK.textContent = isToday ? 'First heat today' : 'First heat ' + day.label.toLowerCase();
      heroV.className = 'hero-v num';
      heroV.innerHTML = durHTML(away);
      heroSub.textContent = fmtClock(b.first) + ' · ' + day.division + ' · ' +
        day.competitors + ' ' + (dayId === 'sunday' ? 'teams' : 'athletes');

      announce('First heat ' + day.label + ' at ' + fmtClock(b.first));

      if (chrono) {
        out.push(secHTML(day.label + ' schedule', day.entries.length,
          groupByStart(day.entries.map(function(e){
            return { e:e, start: wallToEpoch(day.date, e.startSec) };
          }).sort(function(a,x){ return a.start - x.start || a.e.name.localeCompare(x.e.name); }))
          .map(function(g){ return groupHTML(g); }).join('')));
        out.push(tbdHTML(day));
      }

    } else if (t >= b.last) {
      /* ---- day finished ---- */
      heroK.textContent = day.label + ' complete';
      heroV.className = 'hero-v words';
      heroV.textContent = 'That’s a wrap';
      heroSub.textContent = (day.heatCount || 0) + ' heats done · ' +
        day.competitors + (dayId === 'sunday' ? ' teams' : ' athletes') +
        ' · last at ' + fmtClock(b.last - day.heatMinutes * 60000);
      announce(day.label + ' complete');

      if (chrono) {
        out.push(secHTML(day.label + ' running order', day.entries.length,
          '<details class="done" id="d-full" open><summary>Full day</summary>' +
          '<div class="done-list">' +
          groupByStart(c.done).map(function(g){ return groupHTML(g); }).join('') +
          '</div></details>'));
        out.push(tbdHTML(day));
      }

    } else {
      /* ---- day in progress ---- */
      heroV.className = 'hero-v num';

      if (c.live.length) {
        hero.classList.add('is-live');
        heroK.innerHTML = '<span class="dot"></span>On now';
        heroV.innerHTML = durHTML((c.liveEnd - t) / 1000);
        heroSub.textContent = 'Ends ' + fmtClock(c.liveEnd) + ' · ' + c.live.length +
          (dayId === 'sunday' ? ' on the floor' : (c.live.length === 1 ? ' athlete up' : ' athletes up'));
        announce('On now: ' + c.live.map(function(r){
          return r.e.name + ', ' + r.e.arena + ', lane ' + r.e.lane;
        }).join('. '));
        // Deliberately outside the `chrono` guard: "who is on right now" is
        // the page's whole job, so it stays put in the arena view too.
        out.push(secHTML('On the floor', c.live.length,
          c.live.map(function(r){
            return '<div class="now-card ' + arenaCls(r.e.arena) + '">' +
              '<div class="now-name">' + esc(r.e.name) + '</div>' +
              '<div class="now-arena">' + esc(r.e.arena) +
                '<em>Event ' + r.e.eventNo + '</em></div>' +
              (wodTag(day, r.e.eventNo)
                ? '<div class="now-wod">' + esc(wodTag(day, r.e.eventNo)) + '</div>' : '') +
              '<div class="slots">' +
                '<div class="slot"><i>Heat</i><b class="num">' + r.e.heat + '</b></div>' +
                '<div class="slot"><i>Lane</i><b class="num">' + r.e.lane + '</b></div>' +
                '<div class="slot time"><i>Started</i><b class="num">' +
                  fmtClock(r.start) + '</b></div>' +
              '</div></div>';
          }).join('')));
      } else {
        heroK.textContent = 'Nobody up right now';
        heroV.innerHTML = durHTML((c.nextStart - t) / 1000);
        // textContent already treats its input as literal text; esc() here
        // would double-encode a name containing & or <.
        heroSub.textContent = 'Until ' + c.next[0].e.name + ' at ' + fmtClock(c.nextStart);
        announce('Nobody up. Next: ' + c.next[0].e.name + ', ' +
          c.next[0].e.arena + ', at ' + fmtClock(c.nextStart));
      }

      if (chrono) {
        if (c.next.length) {
          out.push(secHTML('Up next · ' + fmtMins((c.nextStart - t) / 1000), c.next.length,
            c.next.map(function(r){ return rowHTML(r, 'next'); }).join('')));
        }
        if (c.later.length) {
          out.push(secHTML('Later today', c.later.length,
            groupByStart(c.later).map(function(g){ return groupHTML(g); }).join('')));
        }
        out.push(tbdHTML(day));
        if (c.done.length) {
          out.push('<details class="done" id="d-earlier"><summary>Earlier today · ' +
            c.done.length + ' done</summary><div class="done-list">' +
            groupByStart(c.done).map(function(g){ return groupHTML(g); }).join('') +
            '</div></details>');
        }
      }
    }

    ['time','arena','wods'].forEach(function(m){
      document.getElementById('mode-' + m)
        .setAttribute('aria-pressed', String(viewMode === m));
    });
    syncPicker(day);

    if (viewMode === 'arena') {
      out.push(arenaSections(day, c));
      out.push(tbdHTML(day));
    } else if (viewMode === 'wods') {
      out.push(workoutSections(day, c, t));
    }

    paint(out.join(''));
  }

  /* ---- tabs, one per competition day ---- */
  (function(){
    var fmt = new Intl.DateTimeFormat('en-US', { day: 'numeric', timeZone: 'UTC' });
    document.getElementById('tabs').innerHTML = DATA.days.map(function(d){
      return '<button class="tab" type="button" role="tab" id="tab-' + d.id +
        '" aria-selected="false" aria-controls="panel">' +
        d.label.slice(0, 3).toUpperCase() + ' ' +
        fmt.format(new Date(d.date + 'T12:00:00Z')) +
        '<small>' + esc(d.division.replace(/\s+Event$/i, '')) + '</small></button>';
    }).join('');
    DATA.days.forEach(function(d){
      document.getElementById('tab-' + d.id).addEventListener('click', function(){
        selected = d.id; render();
      });
    });
  })();

  /* ---- view mode ---- */
  // Remembered per viewer. Storage throws in some private-browsing modes, so
  // every access is guarded and the page renders fine without it.
  try {
    var saved = localStorage.getItem('bb26-view');
    if (saved === 'arena' || saved === 'time' || saved === 'wods') viewMode = saved;
    var savedDiv = localStorage.getItem('bb26-division');
    if (savedDiv) division = savedDiv;
  } catch (err) {}

  document.getElementById('division').addEventListener('change', function(){
    division = this.value;
    try { localStorage.setItem('bb26-division', division); } catch (err) {}
    render();
  });
  [['mode-time','time'], ['mode-arena','arena'], ['mode-wods','wods']].forEach(function(pair){
    document.getElementById(pair[0]).addEventListener('click', function(){
      viewMode = pair[1];
      try { localStorage.setItem('bb26-view', viewMode); } catch (err) {}
      render();
    });
  });

  /* ---- simulated-time marker ---- */
  (function(){
    if (frozen !== null) {
      document.getElementById('venueLine').textContent = 'Pensacola Beach · simulated time';
    }
  })();

  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
